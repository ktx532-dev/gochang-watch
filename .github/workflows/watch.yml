name: gochang-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gochang-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Check availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_DATES: ${{ vars.WATCH_DATES }}
          ACTIVE_HOURS: ${{ vars.ACTIVE_HOURS }}
          FACILITIES: ${{ vars.FACILITIES }}
          TEST_ALERT: ${{ vars.TEST_ALERT }}
          REMIND_MIN: ${{ vars.REMIND_MIN }}
        run: python check.py
      - name: Save state
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
